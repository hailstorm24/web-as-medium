<!DOCTYPE html><!--document type declaration-->
<html>

<head><!-- a container for metadata -->
    <meta charset="utf-8"><!--charset: character encoding capable of encoding all characters on the web  -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <!--for browser compatibility: choose rendering engine to view the page in an correct view (for old ver. IE)  -->
    <title>hyperlinked set</title>
    <!--declaring the title, or name, of the HTML document. displayed in the browser's title bar-->
    <meta name="description" content=""><!--keywords/snippet for search engines-->
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="style.css">
    <!--the browser will (probably) render the width of the page at the width of its own screen -->
</head>

<body>
    <div class="page crate-closed">
        <div class="main-panel">
            <div class="diagram">
                <svg class="ring" viewBox="-380 -380 760 760" role="img"
                    aria-label="Chord diagram"></svg>
            </div>
        </div>
        <div class="panel-slide">
            <div class="side-panel" id="side-panel"></div>
            <button class="panel-toggle" type="button" aria-controls="side-panel" aria-expanded="true"
                aria-label="Close side panel">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
        <div class="crate-slide">
            <div class="crate" id="crate">
                <div class="crate-info">
                    <div class="crate-header">
                        <p class="crate-count"></p>
                        <button class="crate-all" type="button"></button>
                    </div>
                    <div class="crate-columns">
                        <span></span>
                        <button class="crate-sort" type="button" data-key="title">Title</button>
                        <button class="crate-sort" type="button" data-key="artist">Artist</button>
                        <button class="crate-sort" type="button" data-key="date">Released</button>
                    </div>
                </div>
                <div class="crate-list"></div>
            </div>
            <button class="crate-toggle" type="button" aria-controls="crate" aria-expanded="false"
                aria-label="Open record crate">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </div>
    <script src="main.js"></script>
    <script src="diagram.js"></script>
    <script src="chords.js"></script>
    <script src="crate.js"></script>
</body>

</html>
