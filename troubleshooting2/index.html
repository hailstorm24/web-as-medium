<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phrase Sequencer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="poster">
    <p class="counter">Phrase 1 of 3</p>
    <h1 class="phrase">The web is a place.</h1>

    <div class="controls">
      <button class="next-button">Next phrase</button>
      <button class="invert-button">Invert colors</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
